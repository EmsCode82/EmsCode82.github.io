<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" width="820" height="760" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">How a program thinks: inputs, steps, a decision, and outputs</title>
  <desc id="svg-desc">Textbook flowchart for free shipping. Start, then input the order total, then compare it to 50 dollars, then decide: if the total is 50 dollars or more, output free shipping; otherwise output charge shipping. Both paths end.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#5aa9e6"/>
    </marker>
  </defs>

  <rect width="820" height="760" rx="12" fill="#141922"/>
  <rect x="0.5" y="0.5" width="819" height="759" rx="11.5" fill="none" stroke="#242a33"/>

  <text x="410" y="36" text-anchor="middle" fill="#8bd3ff" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">How a program thinks</text>
  <text x="410" y="58" text-anchor="middle" fill="#bac6d3" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Worked example: should we give free shipping?</text>

  <!-- Start -->
  <ellipse cx="410" cy="104" rx="78" ry="30" fill="#1a2430" stroke="#5aa9e6" stroke-width="2"/>
  <text x="410" y="109" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Start</text>

  <line x1="410" y1="134" x2="410" y2="168" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Input parallelogram -->
  <polygon points="292,172 568,172 538,236 262,236" fill="#163044" stroke="#5aa9e6" stroke-width="2"/>
  <text x="410" y="194" text-anchor="middle" fill="#5aa9e6" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">INPUT</text>
  <text x="410" y="218" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Order total (dollars)</text>

  <line x1="410" y1="236" x2="410" y2="270" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Step rectangle -->
  <rect x="258" y="274" width="304" height="68" rx="6" fill="#1a2430" stroke="#5aa9e6" stroke-width="2"/>
  <text x="410" y="300" text-anchor="middle" fill="#5aa9e6" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">STEP</text>
  <text x="410" y="324" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Compare the total to $50</text>

  <line x1="410" y1="342" x2="410" y2="376" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="410,380 548,448 410,516 272,448" fill="#1d3a52" stroke="#8bd3ff" stroke-width="2.25"/>
  <text x="410" y="436" text-anchor="middle" fill="#8bd3ff" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">DECISION</text>
  <text x="410" y="458" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Is the total $50</text>
  <text x="410" y="478" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">or more?</text>

  <!-- Yes branch -->
  <line x1="272" y1="448" x2="168" y2="448" stroke="#5aa9e6" stroke-width="1.75"/>
  <line x1="168" y1="448" x2="168" y2="548" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="214" y="438" text-anchor="middle" fill="#8bd3ff" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Yes</text>

  <polygon points="70,554 266,554 246,618 50,618" fill="#163044" stroke="#5aa9e6" stroke-width="2"/>
  <text x="158" y="576" text-anchor="middle" fill="#5aa9e6" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">OUTPUT</text>
  <text x="158" y="600" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Free shipping</text>

  <!-- No branch -->
  <line x1="548" y1="448" x2="652" y2="448" stroke="#5aa9e6" stroke-width="1.75"/>
  <line x1="652" y1="448" x2="652" y2="548" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="606" y="438" text-anchor="middle" fill="#8bd3ff" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">No</text>

  <polygon points="554,554 750,554 730,618 534,618" fill="#163044" stroke="#5aa9e6" stroke-width="2"/>
  <text x="642" y="576" text-anchor="middle" fill="#5aa9e6" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">OUTPUT</text>
  <text x="642" y="600" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Charge shipping</text>

  <!-- Merge to End -->
  <line x1="158" y1="618" x2="158" y2="668" stroke="#5aa9e6" stroke-width="1.75"/>
  <line x1="652" y1="618" x2="652" y2="668" stroke="#5aa9e6" stroke-width="1.75"/>
  <line x1="158" y1="668" x2="652" y2="668" stroke="#5aa9e6" stroke-width="1.75"/>
  <line x1="410" y1="668" x2="410" y2="688" stroke="#5aa9e6" stroke-width="1.75" marker-end="url(#arrow)"/>

  <ellipse cx="410" cy="718" rx="78" ry="26" fill="#1a2430" stroke="#5aa9e6" stroke-width="2"/>
  <text x="410" y="723" text-anchor="middle" fill="#f0f5fa" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">End</text>
</svg>
